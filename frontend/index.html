<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Promptify</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <div class="logo-section">

      <img
        src="./images/logo.png"
        class="logo"
      >

      <h1>Promptify</h1>

    </div>

    <div class="nav-links">

      <a href="#">
        Home
      </a>

      <a href="#">
        Trending
      </a>

      <a href="#">
        Categories
      </a>

    </div>

  </nav>

  <!-- HERO -->

  <section class="hero">

    <h2>
      Trending AI Prompts &
      Stunning Images
    </h2>

    <p>
      Discover creative prompts,
      cinematic visuals and viral AI ideas.
    </p>

    <input
      type="text"
      id="searchInput"
      placeholder="Search prompts..."
    >

  </section>

  <!-- PROMPT GRID -->

  <section>

    <div
      class="prompt-grid"
      id="promptGrid"
    >

    </div>

  </section>

  <!-- FOOTER -->

  <footer>

    <h3>
      Promptify
    </h3>

    <p>
      Discover trending AI prompts
      and stunning visuals.
    </p>

    <p>
      © 2026 Promptify.
      All Rights Reserved.
    </p>

  </footer>

  <script src="script.js"></script>

</body>

</html>
