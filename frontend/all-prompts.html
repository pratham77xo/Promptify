  <style>
    .page-content{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,60px) 18px}
    .page-top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px;margin-bottom:24px}
    .page-top h1{margin:0;font-size:clamp(2rem,5vw,3.2rem)}
    .page-top p{margin:8px 0 0;color:#999;line-height:1.5}
    .page-search{width:min(100%,320px);min-height:46px;padding:12px 14px;border:1px solid #666;border-radius:9px;background:#111;color:#fff;font:inherit}
    .page-search:focus{outline:2px solid #aaa;outline-offset:2px}
    #promptGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .prompt-card{min-width:0;display:flex;flex-direction:column;gap:10px}
    .card-media{position:relative;overflow:hidden;border-radius:12px;background:#1a1a1a}
    .card-media img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
    .tool-label{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;padding:7px 10px;border:1px solid rgba(255,255,255,.45);border-radius:7px;background:rgba(0,0,0,.78);color:#fff;text-decoration:none;font-size:.82rem;font-weight:600}
    .tool-label:hover{background:#fff;color:#000}
    .copy-btn{min-height:42px;border:1px solid #888;border-radius:8px;background:#fff;color:#000;font-weight:700;cursor:pointer}
    .copy-btn:hover{background:#ddd}
    .message{grid-column:1/-1;color:#999;padding:20px 0}
    @media(min-width:640px){#promptGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
    @media(min-width:1024px){#promptGrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}}
  </style>
</head>
